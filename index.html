<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Seasonal Biomarker Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Fira+Sans:wght@300;400;500;600&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a14;--surface:#0b1322;--border:#152238;--text:#c8d4e2;
  --text-dim:#5a6d82;--text-bright:#eae3d6;--accent:#d4a24c;
  --ocean-a:#0c1f3a;--ocean-b:#071428;--land:#1a3248;--land-stroke:#2a4a68;
  --font-title:'Libre Baskerville',Georgia,serif;
  --font-ui:'Fira Sans',system-ui,sans-serif;
  --font-mono:'Fira Mono','Consolas',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-ui);
  overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;
  align-items:center;padding:16px 16px 32px}

/* Header */
header{text-align:center;margin-bottom:8px}
h1{font-family:var(--font-title);font-size:clamp(20px,4vw,28px);font-weight:700;
  color:var(--text-bright);letter-spacing:0.01em;line-height:1.3}
.subtitle{font-size:clamp(11px,2.2vw,13px);color:var(--text-dim);
  font-family:var(--font-mono);margin-top:4px;letter-spacing:0.03em}

/* Globe */
#globe-wrap{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:8px 0}
#globe{width:100%;height:100%;cursor:grab;touch-action:none;border-radius:50%}
#globe:active{cursor:grabbing}
#globe-loading{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:var(--font-mono);font-size:13px;color:var(--text-dim)}
.spinner{width:28px;height:28px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Legend */
#legend{display:flex;align-items:center;gap:8px;margin:6px 0;
  font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
#legend-bar{height:8px;width:clamp(120px,30vw,180px);border-radius:4px}
.legend-labels{display:flex;gap:clamp(8px,2vw,16px);font-size:9px;
  font-family:var(--font-mono);color:var(--text-dim);margin-top:2px;justify-content:center}

/* Controls */
#controls{width:100%;max-width:400px;margin:10px 0}
.slider-row{margin-bottom:4px}
.slider-ticks{display:flex;justify-content:space-between;font-size:10px;
  font-family:var(--font-mono);color:var(--text-dim);padding:0 2px;margin-bottom:3px}
input[type=range]{width:100%;accent-color:var(--accent);height:6px;
  -webkit-appearance:none;background:var(--border);border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.month-label{text-align:center;font-family:var(--font-title);font-size:15px;
  font-weight:700;color:var(--text-bright);margin-top:3px}

/* Dataset toggles */
#dataset-toggles{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.ds-btn{background:var(--surface);color:var(--text-dim);border:1px solid var(--border);
  border-radius:6px;padding:7px 14px;font-size:12px;font-family:var(--font-ui);
  font-weight:400;cursor:pointer;transition:all .2s}
.ds-btn:hover{border-color:var(--accent);color:var(--text)}
.ds-btn.active{background:#122040;color:var(--text-bright);
  border-color:#2a5a90;font-weight:500}

/* Info panel */
#info-panel{width:100%;max-width:440px;margin:8px 0;opacity:0;
  max-height:0;overflow:hidden;transition:opacity .25s,max-height .3s}
#info-panel.open{opacity:1;max-height:500px}
.info-card{background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:14px 18px;font-size:12px}
.info-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.info-country{font-family:var(--font-title);font-size:16px;font-weight:700;color:var(--text-bright)}
.info-value{font-family:var(--font-mono);font-size:22px;font-weight:500}
.info-unit{font-size:10px;color:var(--text-dim)}
.info-region{color:var(--text-dim);margin-bottom:6px;font-size:11px}
.info-meta{display:flex;gap:16px;font-family:var(--font-mono);font-size:10px;
  color:var(--text-dim);margin-bottom:8px}
.info-seasonal{display:flex;justify-content:space-between;padding:8px 0;
  border-top:1px solid var(--border);font-family:var(--font-mono);font-size:11px}
.info-seasonal div{text-align:center}
.info-seasonal .label{font-size:9px;color:var(--text-dim);margin-bottom:2px}
.info-seasonal .val{font-weight:500}
.info-citation{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
  font-size:10px;color:var(--text-dim);line-height:1.5}
.info-citation a{color:var(--accent);text-decoration:none}
.info-citation a:hover{text-decoration:underline}
.info-close{position:absolute;top:8px;right:12px;background:none;border:none;
  color:var(--text-dim);cursor:pointer;font-size:16px;padding:4px}

/* Footer */
footer{text-align:center;font-size:10px;color:#1e2e42;font-family:var(--font-mono);
  margin-top:8px;line-height:1.6;max-width:440px}
footer a{color:var(--accent);text-decoration:none}

/* Hint */
.hint{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);
  text-align:center;margin:4px 0;opacity:.7}

@media(max-width:480px){
  #app{padding:10px 10px 24px}
  .info-card{padding:10px 12px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="app-title">Loading…</h1>
    <div class="subtitle" id="app-subtitle"></div>
  </header>

  <div id="globe-wrap">
    <canvas id="globe"></canvas>
    <div id="globe-loading"><div class="spinner"></div>Loading map data…</div>
  </div>

  <div id="legend">
    <span id="legend-lo"></span>
    <div id="legend-bar"></div>
    <span id="legend-hi"></span>
  </div>
  <div class="legend-labels" id="legend-labels"></div>

  <div id="controls">
    <div class="slider-row">
      <div class="slider-ticks"><span>Jan</span><span>Apr</span><span>Jul</span><span>Oct</span><span>Dec</span></div>
      <input type="range" id="month-slider" min="1" max="12" step="0.1" value="7">
      <div class="month-label" id="month-label"></div>
    </div>
  </div>

  <div id="dataset-toggles"></div>

  <div id="info-panel">
    <div class="info-card" id="info-card"></div>
  </div>

  <div class="hint" id="hint">Drag to rotate · Tap a marker to inspect · Slide to change month</div>

  <footer id="footer"></footer>
</div>

<script>
/* ======================================================================
   Seasonal Biomarker Atlas — config-driven, CSV-backed interactive globe.
   All display text, thresholds, and datasets drawn from data/config.json.
   Replace CSVs and config to show any seasonal biomarker.
   ====================================================================== */

const MONTHS = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];
const SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let config, worldTopo, land, borders;
let datasets = {};
let currentKey = null;
let rotation = [20, -20, 0]; // lambda, phi, gamma
let selectedIdx = null;
let currentMonth = 7;
let canvasW, canvasH, globeR;
let projection, path, ctx;
let pointHitAreas = [];
let dragState = null;

/* ---- Initialisation ---- */
async function init() {
  try {
    config = await fetch('data/config.json').then(r => r.json());
  } catch(e) {
    document.getElementById('globe-loading').textContent = 'Error: could not load data/config.json';
    return;
  }

  document.title = config.title;
  document.getElementById('app-title').textContent = config.title;
  document.getElementById('app-subtitle').textContent =
    `${config.biomarker_name} · ${config.unit} · ${MONTHS[Math.round(currentMonth)-1]}`;

  buildLegend();
  buildDatasetButtons();

  // Load world topology and first dataset in parallel
  const [topo] = await Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()),
    loadDataset(0)
  ]);

  worldTopo = topo;
  land = topojson.feature(topo, topo.objects.countries);
  borders = topojson.mesh(topo, topo.objects.countries, (a,b) => a !== b);

  document.getElementById('globe-loading').style.display = 'none';
  setupCanvas();
  setupInteraction();
  render();

  document.getElementById('footer').innerHTML =
    `<span id="point-count"></span><br>${config.about ? config.about.slice(0,200)+'…' : ''}`;
  updatePointCount();
}

/* ---- Data loading ---- */
async function loadDataset(index) {
  const ds = config.datasets[index];
  const key = ds.label;
  if (datasets[key]) { currentKey = key; return; }

  const cols = config.csv_columns;
  const text = await fetch(ds.file).then(r => r.text());
  const parsed = Papa.parse(text.trim(), { header:true, skipEmptyLines:true });

  datasets[key] = parsed.data.map(row => ({
    country: row[cols.country],
    region: row[cols.region],
    lat: +row[cols.latitude],
    lng: +row[cols.longitude],
    junAug: +row[cols.jun_aug_value],
    decFeb: +row[cols.dec_feb_value],
    n: row[cols.sample_size] ? +row[cols.sample_size] : null,
    shortCite: row[cols.short_citation] || '',
    fullCite: row[cols.full_citation] || '',
    url: row[cols.url] || ''
  })).filter(d => !isNaN(d.lat) && !isNaN(d.lng) && !isNaN(d.junAug));

  currentKey = key;
}

function getData() { return datasets[currentKey] || []; }

/* ---- Interpolation ---- */
function interpolate(junAug, decFeb, month) {
  const peak = config.interpolation_peak_month || 8;
  const mean = (junAug + decFeb) / 2;
  const amp = (junAug - decFeb) / 2;
  return mean + amp * Math.cos(2 * Math.PI * (month - peak) / 12);
}

/* ---- Color scale ---- */
function valueToColor(v) {
  const sc = config.color_scale;
  const t = Math.max(0, Math.min(1, (v - sc.min) / (sc.max - sc.min)));
  const h = t * 130; // red(0) → green(130)
  const s = 75 + t * 10;
  const l = 42 + t * 12;
  return `hsl(${h},${s}%,${l}%)`;
}
function valueToGlow(v) {
  const sc = config.color_scale;
  const t = Math.max(0, Math.min(1, (v - sc.min) / (sc.max - sc.min)));
  const h = t * 130;
  return `hsla(${h},85%,55%,0.35)`;
}
function statusLabel(v) {
  const th = config.color_scale.thresholds;
  for (const t of th) { if (v < t.value) return t.label; }
  return th[th.length-1].label;
}

/* ---- UI builders ---- */
function buildLegend() {
  const sc = config.color_scale;
  const bar = document.getElementById('legend-bar');
  bar.style.background = `linear-gradient(90deg,${sc.thresholds.map((t,i)=>t.color+' '+(i/(sc.thresholds.length-1)*100)+'%').join(',')})`;
  document.getElementById('legend-lo').textContent = `<${sc.thresholds[0].value}`;
  document.getElementById('legend-hi').textContent = `${sc.max}+`;

  const labels = document.getElementById('legend-labels');
  labels.innerHTML = sc.thresholds.map(t =>
    `<span style="color:${t.color}">${t.label}</span>`).join('');
}

function buildDatasetButtons() {
  const wrap = document.getElementById('dataset-toggles');
  config.datasets.forEach((ds, i) => {
    const btn = document.createElement('button');
    btn.className = 'ds-btn' + (i===0?' active':'');
    btn.textContent = ds.label;
    btn.onclick = async () => {
      wrap.querySelectorAll('.ds-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      await loadDataset(i);
      selectedIdx = null;
      closeInfoPanel();
      updatePointCount();
      render();
    };
    wrap.appendChild(btn);
  });
}

function updatePointCount() {
  const el = document.getElementById('point-count');
  if(el) el.textContent = `${getData().length} locations · ${currentKey}`;
}

/* ---- Canvas setup ---- */
function setupCanvas() {
  const canvas = document.getElementById('globe');
  const wrap = document.getElementById('globe-wrap');
  const rect = wrap.getBoundingClientRect();
  const size = Math.floor(rect.width);
  canvasW = canvasH = size;
  globeR = size / 2 - 10;

  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  projection = d3.geoOrthographic()
    .scale(globeR)
    .translate([canvasW/2, canvasH/2])
    .rotate(rotation)
    .clipAngle(90);

  path = d3.geoPath(projection, ctx);
}

/* ---- Render ---- */
function render() {
  if (!ctx || !land) return;
  const cx = canvasW/2, cy = canvasH/2;
  projection.rotate(rotation);

  ctx.clearRect(0, 0, canvasW, canvasH);

  // Atmosphere glow
  const atm = ctx.createRadialGradient(cx, cy, globeR*0.96, cx, cy, globeR*1.14);
  atm.addColorStop(0, 'rgba(50,130,210,0.07)');
  atm.addColorStop(0.6, 'rgba(30,90,170,0.03)');
  atm.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = atm;
  ctx.beginPath(); ctx.arc(cx, cy, globeR*1.14, 0, Math.PI*2); ctx.fill();

  // Ocean
  const ocean = ctx.createRadialGradient(cx-globeR*0.2, cy-globeR*0.2, globeR*0.05, cx, cy, globeR);
  ocean.addColorStop(0, '#112d50');
  ocean.addColorStop(0.6, '#0b1e38');
  ocean.addColorStop(1, '#071428');
  ctx.beginPath(); ctx.arc(cx, cy, globeR, 0, Math.PI*2);
  ctx.fillStyle = ocean; ctx.fill();

  // Graticule
  ctx.beginPath();
  path(d3.geoGraticule10());
  ctx.strokeStyle = 'rgba(55,100,155,0.12)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Countries fill
  ctx.beginPath();
  path(land);
  ctx.fillStyle = '#15304a';
  ctx.fill();

  // Country borders
  ctx.beginPath();
  path(borders);
  ctx.strokeStyle = 'rgba(60,110,160,0.25)';
  ctx.lineWidth = 0.4;
  ctx.stroke();

  // Globe rim
  ctx.beginPath(); ctx.arc(cx, cy, globeR, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(80,140,210,0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Data markers
  pointHitAreas = [];
  const data = getData();
  const m = currentMonth;

  // Sort by z-depth so front markers draw on top
  const projected = data.map((d, i) => {
    const coord = projection([d.lng, d.lat]);
    const geoD = d3.geoDistance([d.lng, d.lat], [-rotation[0], -rotation[1]]);
    return { d, i, coord, visible: geoD < Math.PI/2 };
  }).filter(p => p.visible).sort((a,b) => {
    const da = d3.geoDistance([a.d.lng, a.d.lat], [-rotation[0], -rotation[1]]);
    const db = d3.geoDistance([b.d.lng, b.d.lat], [-rotation[0], -rotation[1]]);
    return db - da; // far first, near last (on top)
  });

  projected.forEach(({d, i, coord}) => {
    const val = interpolate(d.junAug, d.decFeb, m);
    const [sx, sy] = coord;
    const isSel = selectedIdx === i;
    const r = isSel ? 8 : 5;

    // Glow
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r*3.5);
    g.addColorStop(0, valueToGlow(val));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(sx, sy, r*3.5, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();

    // Marker
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fillStyle = valueToColor(val); ctx.fill();
    if (isSel) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 0.5; ctx.stroke();
    }

    pointHitAreas.push({ x:sx, y:sy, r: r+6, idx:i });
  });

  // Subtitle update
  const mIdx = Math.round(m) - 1;
  document.getElementById('app-subtitle').textContent =
    `${config.biomarker_name} · ${currentKey} · ${MONTHS[mIdx < 0 ? 0 : mIdx > 11 ? 11 : mIdx]}`;
}

/* ---- Interaction ---- */
function setupInteraction() {
  const canvas = document.getElementById('globe');

  // Drag
  const getXY = (e) => {
    const t = e.touches ? e.touches[0] : e;
    return [t.clientX, t.clientY];
  };

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Hit test markers
    for (let i = pointHitAreas.length-1; i >= 0; i--) {
      const p = pointHitAreas[i];
      if (Math.hypot(x-p.x, y-p.y) < p.r) {
        selectedIdx = p.idx;
        openInfoPanel(p.idx);
        render();
        return;
      }
    }
    selectedIdx = null;
    closeInfoPanel();

    dragState = { x: e.clientX, y: e.clientY, rot: [...rotation] };
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!dragState) return;
    const dx = e.clientX - dragState.x;
    const dy = e.clientY - dragState.y;
    const sens = 0.3;
    rotation[0] = dragState.rot[0] - dx * sens;
    rotation[1] = Math.max(-80, Math.min(80, dragState.rot[1] + dy * sens));
    render();
  });

  canvas.addEventListener('pointerup', () => { dragState = null; });
  canvas.addEventListener('pointercancel', () => { dragState = null; });

  // Month slider
  const slider = document.getElementById('month-slider');
  slider.addEventListener('input', () => {
    currentMonth = +slider.value;
    const mIdx = Math.round(currentMonth) - 1;
    document.getElementById('month-label').textContent = MONTHS[mIdx < 0 ? 0 : mIdx > 11 ? 11 : mIdx];
    if (selectedIdx !== null) openInfoPanel(selectedIdx); // update value
    render();
  });
  document.getElementById('month-label').textContent = MONTHS[6];

  // Resize
  window.addEventListener('resize', () => {
    setupCanvas();
    render();
  });
}

/* ---- Info panel ---- */
function openInfoPanel(idx) {
  const data = getData();
  const d = data[idx];
  if (!d) return;
  const val = interpolate(d.junAug, d.decFeb, currentMonth);
  const status = statusLabel(val);
  const delta = Math.abs(d.junAug - d.decFeb);

  const card = document.getElementById('info-card');
  card.innerHTML = `
    <div class="info-header">
      <span class="info-country">${d.country}</span>
      <span class="info-value" style="color:${valueToColor(val)}">${val.toFixed(0)}
        <span class="info-unit">${config.unit}</span></span>
    </div>
    <div class="info-region">${d.region || ''}</div>
    <div class="info-meta">
      ${d.n ? '<span>N\u2009=\u2009'+d.n.toLocaleString()+'</span>' : ''}
      <span style="color:${valueToColor(val)}">${status}</span>
    </div>
    <div class="info-seasonal">
      <div><div class="label">JUN–AUG</div><div class="val" style="color:${valueToColor(d.junAug)}">${d.junAug.toFixed(0)}</div></div>
      <div><div class="label">DEC–FEB</div><div class="val" style="color:${valueToColor(d.decFeb)}">${d.decFeb.toFixed(0)}</div></div>
      <div><div class="label">Δ\u2009SEASONAL</div><div class="val" style="color:var(--accent)">${delta.toFixed(0)}</div></div>
    </div>
    <div class="info-citation">
      ${d.shortCite}${d.url ? ' · <a href="'+d.url+'" target="_blank" rel="noopener">View source ↗</a>' : ''}
      ${d.fullCite ? '<br><br><em>'+d.fullCite+'</em>' : ''}
    </div>
  `;
  document.getElementById('info-panel').classList.add('open');
  document.getElementById('hint').style.display = 'none';
}

function closeInfoPanel() {
  document.getElementById('info-panel').classList.remove('open');
  document.getElementById('hint').style.display = '';
}

/* ---- Start ---- */
init();
</script>
</body>
</html>
